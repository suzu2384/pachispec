name: Validate, sync AI config and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: pachispec-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PACHISPEC_AI_FIREBASE_CONFIG: ${{ vars.PACHISPEC_AI_FIREBASE_CONFIG }}
      PACHISPEC_AI_APP_CHECK_SITE_KEY: ${{ vars.PACHISPEC_AI_APP_CHECK_SITE_KEY }}
      PACHISPEC_AI_SPARK_VERIFIED: ${{ vars.PACHISPEC_AI_SPARK_VERIFIED }}
      PACHISPEC_AI_MODEL: ${{ vars.PACHISPEC_AI_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and regression tests
        run: |
          node --check ai-spec.js
          node --check app.js
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Generate public AI configuration
        run: python3 tools/sync-ai-config.py
      - name: Commit configuration when changed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- ai-config.js index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ai-config.js index.html
            git commit -m "chore: synchronize public Firebase AI configuration"
            git push origin HEAD:main
          fi
      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' index.html | head -n1)"
          if [ -z "$VERSION" ]; then echo "Missing UI version" >&2; exit 1; fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already published."
          else
            gh release create "$VERSION" --target "$(git rev-parse HEAD)" --title "$VERSION" --notes-file RELEASE_NOTES.md
          fi
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null || echo "Pages rebuild not requested."
